name: Verify application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server --omit=dev
      - name: Validate Node server and browser script
        run: |
          node --check server/index.js
          node -e "const fs=require('fs'); const html=fs.readFileSync('web/index.html','utf8'); const script=html.match(/<script>([\s\S]*?)<\/script>\s*<\/body>/); if (!script) throw new Error('Inline script not found'); new Function(script[1]);"
      - name: Test server authentication and report queue
        run: npm test --prefix server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Python pipeline
        run: |
          python -m pip install "pandas>=2.0" "openpyxl>=3.1"
          python -m unittest pipeline/test_import_inbox.py pipeline/test_data_quality.py pipeline/test_export_json.py
