<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Đăng nhập · Calida Analyst</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f7fb; color: #172033; }
    main { width: min(100% - 32px, 390px); box-sizing: border-box; padding: 32px; background: #fff; border: 1px solid #dfe6f1; border-radius: 16px; box-shadow: 0 16px 48px rgba(18, 53, 98, .12); }
    h1 { margin: 0 0 8px; font-size: 24px; } p { margin: 0 0 24px; color: #60708a; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 600; } input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #b9c6d8; border-radius: 8px; font: inherit; }
    input:focus { outline: 3px solid rgba(31, 94, 234, .18); border-color: #1f5eea; } button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 8px; background: #1f5eea; color: #fff; cursor: pointer; font: 600 15px inherit; }
    button:disabled { opacity: .65; cursor: wait; } #error { min-height: 21px; margin-top: 14px; color: #b42318; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Calida Analyst</h1>
    <p>Đăng nhập để xem dữ liệu và sử dụng các công cụ phân tích.</p>
    <form id="loginForm">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" autocomplete="username" maxlength="64" placeholder="Để trống nếu hệ thống chỉ có một tài khoản">
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submit" type="submit">Đăng nhập</button>
      <div id="error" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submit");
    const error = document.getElementById("error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      button.disabled = true;
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: form.username.value.trim(), password: form.password.value }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "Không thể đăng nhập");
        window.location.assign("/");
      } catch (err) {
        error.textContent = err.message || "Không thể đăng nhập";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
