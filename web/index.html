<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calida Analyst System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4FC; --panel:#FFFFFF; --panel-2:#F4F8FE; --line:#E1E9F5;
  --ink:#0E1F5B; --ink-2:#34446F; --muted:#7B89A8;
  --brand:#1F5EEA; --brand-soft:#E3EDFF;
  --up:#12A150; --up-soft:#E3F6EA; --down:#E5283B; --down-soft:#FDE7EA;
  --warn:#E98A0C; --warn-soft:#FFF1DE; --neutral-soft:#EDF0F5;
  --shadow:0 1px 2px rgba(20,48,120,.05),0 4px 16px rgba(20,48,120,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1430; --panel:#111D40; --panel-2:#16244D; --line:#223261;
    --ink:#E6ECFF; --ink-2:#B9C4E4; --muted:#8190B8;
    --brand:#5B8CFF; --brand-soft:#1C2E63;
    --up:#34C774; --up-soft:#133A2A; --down:#FF5C6C; --down-soft:#43202B;
    --warn:#F5A742; --warn-soft:#3F2E14; --neutral-soft:#1D2A52;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1430; --panel:#111D40; --panel-2:#16244D; --line:#223261;
  --ink:#E6ECFF; --ink-2:#B9C4E4; --muted:#8190B8;
  --brand:#5B8CFF; --brand-soft:#1C2E63;
  --up:#34C774; --up-soft:#133A2A; --down:#FF5C6C; --down-soft:#43202B;
  --warn:#F5A742; --warn-soft:#3F2E14; --neutral-soft:#1D2A52;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:8px;padding:0 10px 26px}
.logo b{font-size:26px;letter-spacing:-.5px;color:var(--ink)}
.logo small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.8px;color:var(--ink-2);margin-top:-4px}
nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:10px;padding:11px 14px;margin-bottom:4px;font-size:15px;color:var(--ink-2);text-align:left}
nav button:hover{background:var(--panel-2)}
nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
nav svg{width:20px;height:20px;flex:none}
.nav-foot{margin-top:auto}
main{padding:18px 26px 32px;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.search{flex:0 1 440px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;color:var(--ink);font:inherit}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--ink-2)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.icon-btn{background:none;border:0;padding:6px;border-radius:8px}
h1{font-size:30px;line-height:1.15;margin:4px 0 2px;letter-spacing:-.6px}
.sub{color:var(--ink-2);font-size:15px;margin:0 0 16px}
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2{font-size:17px;margin:0;font-weight:600}
.ic{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.ic svg{width:18px;height:18px}
.link{margin-left:auto;background:none;border:0;color:var(--brand);font-size:13px;white-space:nowrap}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.4px}
.kpi .l{color:var(--ink-2);font-size:13px}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.bg-up{background:var(--up-soft);color:var(--up)} .bg-down{background:var(--down-soft);color:var(--down)}
.bg-warn{background:var(--warn-soft);color:var(--warn)} .bg-brand{background:var(--brand-soft);color:var(--brand)} .bg-neutral{background:var(--neutral-soft);color:var(--ink-2)}
.tag{display:inline-block;border-radius:7px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip{display:inline-block;border-radius:999px;padding:5px 14px;font-size:13px;background:var(--brand-soft);color:var(--brand);margin:0 6px 6px 0}
.chip.risk{background:var(--down-soft);color:var(--down)}
.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:9px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:0;background:var(--panel-2);border-radius:9px;padding:7px 10px;color:var(--ink-2);font-size:13px}
.seg button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;background:var(--panel-2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--panel-2)}
tr.sel td{background:var(--brand-soft)}
.t{font-weight:700}
.box{background:var(--panel-2);border-radius:10px;padding:10px 14px}
.box .l{font-size:13px;color:var(--ink-2)}
.box .v{font-size:20px;font-weight:700}
.prose{color:var(--ink-2);line-height:1.65;margin:10px 0 0;max-width:72ch}
.bar{height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.row{display:flex;align-items:center;gap:10px}
.list li{margin-bottom:8px}
.list{padding-left:18px;margin:0;color:var(--ink-2)}
.list li::marker{color:var(--brand)}
.label-sm{font-size:13px;color:var(--ink-2);margin:12px 0 6px;display:flex;gap:8px;align-items:center}
.span-2{grid-column:span 2}
.demo{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-left:8px;vertical-align:middle;font-weight:600}
.heat{display:grid;grid-template-columns:80px repeat(5,1fr);gap:4px;font-size:12px;align-items:center}
.heat div.c{height:24px;border-radius:4px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;flex:1;background:var(--panel-2)}
.stack i{display:block;height:100%}
/* reports + chat */
.chat{display:flex;flex-direction:column;height:640px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.msg{padding:10px 13px;border-radius:12px;max-width:92%;white-space:pre-wrap;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff}
.msg.a{align-self:flex-start;background:var(--panel-2);color:var(--ink)}
.msg.err{background:var(--down-soft);color:var(--down)}
.composer{display:flex;gap:8px;margin-top:10px}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;height:44px}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--brand);color:#fff;font-weight:600}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.suggest button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;margin:0 6px 6px 0;color:var(--ink-2)}
dialog{border:0;border-radius:16px;padding:0;max-width:720px;max-height:90vh;overflow:auto;width:92vw;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(8,18,50,.45)}
.dlg{padding:20px 22px}
.dlg textarea,.dlg input,.dlg select{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.dlg textarea{height:220px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.detail dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:13.5px}
.detail dt{color:var(--ink-2)} .detail dd{margin:0;text-align:right;font-weight:600}
.empty{color:var(--muted);padding:14px 0}
@media (max-width:1100px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.logo{padding:6px 10px}nav{display:flex;flex-wrap:wrap}nav button{width:auto}.nav-foot{display:none}.span-2{grid-column:auto}}
@media (max-width:760px){main{padding:14px}.fgrid{grid-template-columns:1fr}.topbar .right .date{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><g fill="var(--brand)"><circle cx="20" cy="20" r="4"/><g id="pet"><ellipse cx="20" cy="8" rx="3.4" ry="6.5"/></g><use href="#pet" transform="rotate(45 20 20)"/><use href="#pet" transform="rotate(90 20 20)"/><use href="#pet" transform="rotate(135 20 20)"/><use href="#pet" transform="rotate(180 20 20)"/><use href="#pet" transform="rotate(225 20 20)"/><use href="#pet" transform="rotate(270 20 20)"/><use href="#pet" transform="rotate(315 20 20)"/></g></svg>
      <div><b>Calida</b><small>ASSET MANAGEMENT</small></div>
    </div>
    <nav id="nav" aria-label="Điều hướng chính"></nav>
    <div class="nav-foot"><nav><button id="themeBtn">Đổi giao diện sáng/tối</button></nav></div>
  </aside>
  <main>
    <div class="topbar">
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Tìm mã cổ phiếu, báo cáo, quỹ đầu tư…" aria-label="Tìm kiếm"></label>
      <div class="right"><div class="date"><b id="dateTxt"></b><div class="muted" id="dowTxt"></div></div><button class="link" id="logoutBtn" title="Đăng xuất">Đăng xuất</button><div class="avatar" id="userAvatar">C</div></div>
    </div>
    <div id="page"></div>
  </main>
</div>

<dialog id="addDlg"><div class="dlg" id="addBody"></div></dialog>
<dialog id="adminDlg"><div class="dlg" id="adminBody"></div></dialog>

<script src="config.js"></script>
<script>
/* =========================================================
   DATA LAYER — đọc dashboard.json do pipeline Python xuất ra.
   Cấu hình trong config.js (DATA_URL, API_BASE, REFRESH_MINUTES).
   ========================================================= */
const CFG = Object.assign({DATA_URL:"data/dashboard.json", API_BASE:"", REFRESH_MINUTES:5}, window.CALIDA_CONFIG||{});
let DATA = null;
let API_OK = false;
let CURRENT_USER = null;
let CSRF_TOKEN = "";
const can = role => ({viewer:0,analyst:1,admin:2}[CURRENT_USER?.role] ?? -1) >= ({viewer:0,analyst:1,admin:2}[role] ?? 99);
const api = (path, body, method = body ? "POST" : "GET") => fetch(CFG.API_BASE + path, {
  method,
  headers: Object.assign({"Content-Type":"application/json"}, method !== "GET" && CSRF_TOKEN ? {"x-csrf-token":CSRF_TOKEN} : {}),
  body: body === undefined ? undefined : JSON.stringify(body)
}).then(async r => {
  if (r.status === 401) {
    location.assign("/login");
    throw new Error("Phiên đăng nhập đã hết hạn");
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("Lỗi máy chủ " + r.status));
  return j;
});
async function loadData(){
  const r = await fetch(CFG.DATA_URL + "?t=" + Date.now(), {cache:"no-store"});
  if (!r.ok) throw new Error("Không tải được " + CFG.DATA_URL + " (" + r.status + ")");
  return r.json();
}
const isDemoReports = () => (DATA.reports||[]).some(r => r.source === "Dữ liệu mẫu");
const ago = iso => { if(!iso) return ""; const h = (Date.now() - new Date(iso.replace(" ","T")))/36e5;
  if (h < 1) return "Vừa xong"; if (h < 24) return Math.floor(h) + " giờ trước"; return new Date(iso.replace(" ","T")).toLocaleDateString("vi-VN"); };

/* ============ helpers ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = (n, d=0) => n==null||isNaN(n) ? "—" : Number(n).toLocaleString("vi-VN",{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn = (n, d=0, suf="") => n==null ? "—" : (n>0?"+":"") + nf(n,d) + suf;
const cls = n => n>0 ? "up" : n<0 ? "down" : "muted";
const range = r => r ? `${nf(r[0], r[0]%1?1:0)} – ${nf(r[1], r[1]%1?1:0)}` : "—";
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  doc:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
  brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12h18"/>',
  flow:'<path d="M4 20V14M9 20V10M14 20v-7M19 20V6M3 9l6-4 5 3 6-5"/>',
  fund:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
  rep:'<path d="M4 4h11l5 5v11H4z"/><path d="M8 16v-3M12 16v-6M16 16v-4"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  alert:'<path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18v.5"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  pie:'<path d="M12 3v9h9a9 9 0 1 1-9-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  news:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 15c3 0 5 2 5 4"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56V20.3h-3v-.08A1.7 1.7 0 0 0 10.66 18.66a1.7 1.7 0 0 0-1.88.34l-.06.06L6.6 16.94l.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.56-1.04H5.3v-3h.14A1.7 1.7 0 0 0 7 9.92a1.7 1.7 0 0 0-.34-1.88l-.06-.06L8.72 5.86l.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 11.7 4.7v-.08h3v.08a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.04h.08v3h-.08A1.7 1.7 0 0 0 19.4 15z"/>',
  shield:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const svg = (k, sw=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;
const head = (icon, title, extra="") => `<div class="card-h"><div class="ic">${svg(icon)}</div><h2>${title}</h2>${extra}</div>`;
const goLink = (page, txt="Xem chi tiết") => `<button class="link" data-go="${page}">${txt} ›</button>`;

function spark(vals, w=180, h=56){
  const mn=Math.min(...vals), mx=Math.max(...vals), sx=w/(vals.length-1);
  const pts=vals.map((v,i)=>[i*sx, h-4-(v-mn)/(mx-mn||1)*(h-10)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${w} ${h} L0 ${h}Z" fill="var(--up)" opacity=".10"/><path d="${d}" fill="none" stroke="var(--up)" stroke-width="2"/></svg>`;
}
function donut(parts, label, sub){
  const cols=["var(--brand)","#7FA6F5","#C3D5FA","#E9A23B","#9AA6C2"];
  let acc=0; const R=60, C=2*Math.PI*R;
  const segs=parts.map((p,i)=>{const len=p.v/100*C; const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${cols[i]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"/>`; acc+=len; return s;}).join("");
  return `<div class="row" style="gap:22px;flex-wrap:wrap"><svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="${esc(label)}">${segs}
    <text x="80" y="80" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">${label}</text><text x="80" y="100" text-anchor="middle" font-size="11" fill="var(--ink-2)">${sub}</text></svg>
    <div style="flex:1;min-width:140px">${parts.map((p,i)=>`<div class="row" style="margin:10px 0"><i style="width:12px;height:12px;border-radius:50%;background:${cols[i]}"></i><span style="flex:1">${p.k}</span><b>${nf(p.v,0)}%</b></div>`).join("")}</div></div>`;
}
const statusTag = s => {
  const m={"MUA":"bg-up","NẮM GIỮ":"bg-brand","TĂNG TỶ TRỌNG":"bg-warn","GIẢM TỶ TRỌNG":"bg-down","THEO DÕI":"bg-neutral","KHẢ QUAN":"bg-up","TRUNG LẬP":"bg-neutral","BÁN":"bg-down","KÉM KHẢ QUAN":"bg-down",
    "Tích cực":"bg-up","Trung lập":"bg-neutral","Thận trọng":"bg-warn","Tiêu cực":"bg-down","Cao":"bg-down","Trung bình":"bg-warn","Thấp":"bg-neutral"};
  return `<span class="tag ${m[s]||"bg-neutral"}">${esc(s)}</span>`;
};

/* ============ computed: portfolio signals ============
   Rule theo hệ thống Portfolio Automation:
   - Về vùng mua: Low trong [vùng mua thấp, vùng mua cao]
   - Đạt target: giá ≥ target
   - Cần xử lý: giá ≤ vùng vi phạm
   - Sát vùng vi phạm: giá ≤ vùng vi phạm × 1,03 */
function signals(p){
  const out=[];
  if(p.price==null) return out;
  if(p.price<=p.stop) out.push("Cần xử lý");
  else if(p.price<=p.stop*1.03) out.push("Sát vùng vi phạm");
  if(p.buy && p.low>=p.buy[0] && p.low<=p.buy[1] && (p.status==="MUA"||p.status==="THEO DÕI")) out.push("Về vùng mua");
  if(p.price>=p.target) out.push("Đạt target");
  return out;
}
const perf = p => p.cost && p.price!=null ? (p.price/p.cost-1)*100 : null;
function portfolioStats(){
  const P=DATA.portfolio.positions, c={"Cần xử lý":0,"Sát vùng vi phạm":0,"Về vùng mua":0,"Đạt target":0};
  P.forEach(p=>signals(p).forEach(s=>c[s]++));
  const open=P.filter(p=>p.status!=="THEO DÕI").length;
  const flagged=new Set(P.filter(p=>signals(p).length).map(p=>p.t));
  const bySector={}; P.filter(p=>p.w>0).forEach(p=>bySector[p.sector]=(bySector[p.sector]||0)+p.w);
  return {c,open,other:P.length-flagged.size,bySector};
}

/* ============ computed: broker reports ============ */
function repFilter(){
  const days={"7 ngày":7,"30 ngày":30,"Tất cả":9999}[STATE.repPeriod];
  const asOf=new Date(DATA.asOf);
  return DATA.reports.filter(r=>(asOf-new Date(r.date))/864e5<=days && (STATE.repType==="Tất cả"||r.type===STATE.repType));
}
const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
function repAgg(list){
  const brokers={};
  [...list].sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{
    const b=brokers[r.broker] ||= {broker:r.broker,n:0,latest:r,ow:new Set(),targets:[]};
    b.n++; r.ow.forEach(s=>b.ow.add(s)); if(r.vnTarget && !b.target) b.target=r.vnTarget;
  });
  const stanceCnt={"Tích cực":0,"Trung lập":0,"Thận trọng":0,"Tiêu cực":0};
  Object.values(brokers).forEach(b=>stanceCnt[b.latest.stance]=(stanceCnt[b.latest.stance]||0)+1);
  const sectors={};
  list.forEach(r=>{r.ow.forEach(s=>{(sectors[s] ||= {ow:new Set(),uw:new Set()}).ow.add(r.broker)}); r.uw.forEach(s=>{(sectors[s] ||= {ow:new Set(),uw:new Set()}).uw.add(r.broker)})});
  const stocks={};
  [...list].sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>r.stocks.forEach(s=>{
    const o=stocks[s.t] ||= {t:s.t,calls:{}}; if(!o.calls[r.broker]) o.calls[r.broker]={rec:s.rec,target:s.target,date:r.date};
  }));
  const risks={};
  list.forEach(r=>r.risks.forEach(k=>{const o=risks[k.k] ||= {k:k.k,n:0,sev:0,brokers:new Set()}; o.n++; o.sev=Math.max(o.sev,k.s); o.brokers.add(r.broker);}));
  const targets=Object.values(brokers).map(b=>b.target).filter(Boolean);
  return {brokers:Object.values(brokers).sort((a,b)=>b.n-a.n),stanceCnt,sectors,stocks:Object.values(stocks),risks:Object.values(risks).sort((a,b)=>b.brokers.size*b.sev-a.brokers.size*a.sev||b.n-a.n),
    vnMed:median(targets),vnMin:targets.length?Math.min(...targets):null,vnMax:targets.length?Math.max(...targets):null};
}

    <div class="card">${head("trend","Top mua ròng")}${rank(buys)}</div>

      ${bySector.map(s=>`<tr><td>${esc(s.s)}</td><td class="num ${cls(s.v)}">${sgn(s.v)}</td><td class="num ${cls(s.chg)}">${sgn(s.chg,1,"%")}</td><td class="num">${nf(s.w,1)}%</td></tr>`).join("")}</tbody></table></div></div>
    <div class="card">${head("brief","Dòng tiền theo cổ phiếu")}<div class="tbl-wrap"><table><thead><tr><th>Mã</th><th class="num">Giá trị (tỷ)</th><th>NĐT chính</th><th>Ghi chú</th></tr></thead><tbody>
      ${[...F.tickers].sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,10).map(x=>`<tr><td class="t">${esc(x.t)}</td><td class="num ${cls(x.v)}">${sgn(x.v)}</td><td>${tagInv(x.main)}</td><td class="muted">${esc(x.note||"—")}</td></tr>`).join("")}</tbody></table></div></div>

        <li>Cá nhân ${today["Cá nhân"]>0?"mua":"bán"} ròng ${sgn(today["Cá nhân"])} tỷ, tập trung vào ${topIn}.</li>
        <li>Khối ngoại ${today["Khối ngoại"]>0?"mua":"bán"} ròng ${sgn(today["Khối ngoại"])} tỷ, tập trung ở ${foreignSells}.</li>

    </div>
  </div>`;
}

  </div>`;
}

const SUGGEST=["CTCK nào thận trọng nhất và vì sao?","Đồng thuận target VN-Index cuối năm là bao nhiêu?","Rủi ro nào được nhiều CTCK cảnh báo nhất?","Các CTCK nói gì về HPG?"];
function paintChat(){
  const box=$("#msgs"); if(!box) return;
  if(!API_OK||!can("analyst")){ box.innerHTML=`<div class="msg a">${!can("analyst")?"Tài khoản này chỉ có quyền xem dữ liệu.":`Chưa kết nối được máy chủ API (${esc(CFG.API_BASE||location.origin)}/api). Hỏi đáp và thêm báo cáo cần chạy server; các bảng tổng hợp vẫn hoạt động.`}</div>`; $("#chatSend").disabled=true; $("#suggest").innerHTML=""; return; }
  box.innerHTML = STATE.chat.length ? STATE.chat.map(m=>`<div class="msg ${m.role==="user"?"u":"a"} ${m.err?"err":""}">${esc(m.content)}</div>`).join("")
    : `<div class="msg a">Thư viện hiện có ${DATA.reports.length} báo cáo. Hỏi về quan điểm, target, ngành hay rủi ro của từng CTCK.</div>`;
  $("#suggest").innerHTML = STATE.chat.length ? "" : SUGGEST.map(s=>`<button data-ask="${esc(s)}">${esc(s)}</button>`).join("");
  $("#chatSend").disabled=STATE.chatBusy; $("#chatSend").textContent=STATE.chatBusy?"Đang trả lời…":"Gửi";
  box.scrollTop=box.scrollHeight;
}
async function ask(text){
  text=text.trim(); if(!text||STATE.chatBusy||!API_OK||!can("analyst")) return;
  STATE.chat.push({role:"user",content:text}); STATE.chat.push({role:"assistant",content:"Đang đọc báo cáo…"}); STATE.chatBusy=true; paintChat();
  const idx=STATE.chat.length-1;
  const messages=STATE.chat.slice(0,-1).filter(m=>!m.err).map(m=>({role:m.role,content:m.content})).slice(-12);
  try{ const r=await api("/api/chat",{messages}); STATE.chat[idx].content=r.text||"Không có câu trả lời."; }
  catch(e){ STATE.chat[idx]={role:"assistant",content:"Không trả lời được: "+e.message,err:true}; }
  STATE.chatBusy=false; if(STATE.page==="reports") paintChat();
}

const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=()=>rej(new Error("Không đọc được file"));r.readAsDataURL(f);});
async function extract(){
  const raw=$("#rawTxt").value.trim(), file=$("#pdfIn").files[0];
  if(!raw&&!file){$("#exStatus").textContent="Chọn file PDF hoặc dán nội dung trước khi trích xuất.";return;}
  if(file&&file.size>20*1024*1024){$("#exStatus").textContent="File lớn hơn 20 MB.";return;}
  $("#extractBtn").disabled=true; $("#exStatus").textContent="Đang trích xuất…";
  try{
    const body=file?{pdfBase64:await fileB64(file),filename:file.name}:{text:raw};
    const r=await api("/api/extract",body);
    if(file&&!r.source) r.source=file.name;
    $("#exStatus").textContent="Kiểm tra lại các trường rồi lưu."; renderExForm(r);
  }catch(e){ $("#exStatus").textContent="Không trích xuất được: "+e.message; }
  $("#extractBtn").disabled=false;
}
function renderExForm(r,reportId=""){
  const f=(k,l,v)=>`<label>${l}<input data-f="${k}" value="${esc(v??"")}"></label>`;
  $("#exForm").innerHTML=`<div class="fgrid" style="margin-top:14px">
    ${f("broker","CTCK",r.broker)}${f("date","Ngày (YYYY-MM-DD)",r.date)}
    <label>Loại<select data-f="type">${["Chiến lược","Vĩ mô","Ngành","Doanh nghiệp"].map(x=>`<option ${x===r.type?"selected":""}>${x}</option>`).join("")}</select></label>
    <label>Quan điểm<select data-f="stance">${["Tích cực","Trung lập","Thận trọng","Tiêu cực"].map(x=>`<option ${x===r.stance?"selected":""}>${x}</option>`).join("")}</select></label>
    ${f("title","Tiêu đề",r.title)}${f("vnTarget","Target VN-Index",r.vnTarget)}
    ${f("ow","Ngành tăng tỷ trọng (phẩy)",(r.ow||[]).join(", "))}${f("uw","Ngành giảm tỷ trọng (phẩy)",(r.uw||[]).join(", "))}
    ${f("stocks","Cổ phiếu (MÃ:KN:target; …)",(r.stocks||[]).map(s=>`${s.t}:${s.rec}:${s.target??""}`).join("; "))}
    ${f("risks","Rủi ro (chủ đề:mức; …)",(r.risks||[]).map(k=>`${k.k}:${k.s}`).join("; "))}
    ${f("horizon","Tầm nhìn",r.horizon)}${f("source","Nguồn / tên file",r.source)}
    <label style="grid-column:1/-1">Tóm tắt<textarea data-f="summary" style="height:70px">${esc(r.summary)}</textarea></label></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><span class="muted" id="saveStatus" style="font-size:12.5px;flex:1"></span><button class="btn" id="saveRep" data-report-id="${esc(reportId)}">${reportId?"Lưu thay đổi":"Lưu báo cáo"}</button></div>`;
}
async function saveRep(){
  const g=k=>$(`#exForm [data-f="${k}"]`).value.trim(), sp=s=>s?s.split(/[,;]/).map(x=>x.trim()).filter(Boolean):[];
  const date=g("date");
  if(!g("broker")||!/^\d{4}-\d{2}-\d{2}$/.test(date)){ $("#saveStatus").textContent="Cần có tên CTCK và ngày đúng định dạng YYYY-MM-DD."; return; }
  const rep={broker:g("broker"),date,type:g("type"),title:g("title")||"(Không tiêu đề)",stance:g("stance"),
    vnTarget:parseFloat(g("vnTarget").replace(/\./g,"").replace(",","."))||null,horizon:g("horizon"),source:g("source"),ow:sp(g("ow")),uw:sp(g("uw")),
    stocks:g("stocks").split(";").map(x=>x.trim()).filter(Boolean).map(x=>{const [t,rec,tg]=x.split(":");return {t:(t||"").trim().toUpperCase(),rec:(rec||"").trim().toUpperCase(),target:parseFloat((tg||"").replace(",","."))||null};}).filter(s=>s.t),
    risks:g("risks").split(";").map(x=>x.trim()).filter(Boolean).map(x=>{const [k,s]=x.split(":");return {k:k.trim(),s:Math.min(3,Math.max(1,parseInt(s)||2))};}),
    summary:g("summary")};
  const reportId=$("#saveRep").dataset.reportId||"";
  $("#saveRep").disabled=true; $("#saveStatus").textContent="Đang lưu và cập nhật database…";
  try{ await api(reportId?`/api/reports/${encodeURIComponent(reportId)}`:"/api/reports",{report:rep},reportId?"PATCH":undefined); $("#addDlg").close(); await refresh(true); STATE.repPeriod="Tất cả"; STATE.repSel=reportId||null; render(); }
  catch(e){ $("#saveStatus").textContent="Không lưu được: "+e.message; $("#saveRep").disabled=false; }
}
function editReport(id){const report=DATA.reports.find(r=>r.id===id);if(report&&can("admin")) openAdd(report);}
async function deleteReport(id){
  const report=DATA.reports.find(r=>r.id===id); if(!report||!can("admin")||!confirm(`Xóa báo cáo “${report.title}”? Thao tác này không thể hoàn tác.`)) return;
  try{await api(`/api/reports/${encodeURIComponent(id)}`,undefined,"DELETE"); STATE.repSel=null; await refresh(true); render();}
  catch(e){alert("Không xóa được báo cáo: "+e.message);}
}

/* ============ events ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,tr,[data-go]"); if(!t) return;
  const d=t.dataset;
  if(d.go){go(d.go);return;}
  if(d.ovtab){STATE.ovTab=d.ovtab;render();}
  if(d.newstab){STATE.newsTab=d.newstab;render();}
  if(d.pftab){STATE.pfTab=d.pftab;render();}
  if(d.pfsel){STATE.pfSel=d.pfsel;render();}
  if(d.pfdt){STATE.pfDetailTab=d.pfdt;render();}
  if(d.invtab){STATE.invTab=d.invtab;render();}
  if(d.fundtab){STATE.fundTab=d.fundtab;render();}
  if(d.rp){STATE.repPeriod=d.rp;render();}
  if(d.rt){STATE.repType=d.rt;render();}
  if("rsel" in d){STATE.repSel=d.rsel||null;render();}
  if(d.ask){ask(d.ask);}
  if(d.editRep){editReport(d.editRep);}
  if(d.deleteRep){deleteReport(d.deleteRep);}
  if(d.editUser){openUserDialog(d.editUser);}
  if(d.deleteUser){deleteUser(d.deleteUser);}
  if(t.id==="chatSend"){const v=$("#chatIn").value;$("#chatIn").value="";ask(v);}
  if(t.id==="addRep") openAdd();
  if(t.id==="addUser") openUserDialog();
  if(t.id==="reloadUsers"){STATE.adminUsers=null;STATE.adminError="";loadAdminUsers();}
  if(t.id==="reloadOps"){STATE.adminOps=null;STATE.adminOpsError="";loadAdminOperations();}
  if(t.id==="runBuild") runPipeline(true);
  if(t.id==="runFull") runPipeline(false);
  if(t.id==="adminDlgClose") $("#adminDlg").close();
  if(t.id==="saveUser") saveUser(t.dataset.userId||"");
  if(t.id==="dlgClose") $("#addDlg").close();
  if(t.id==="extractBtn") extract();
  if(t.id==="saveRep") saveRep();
  if(t.id==="refreshBtn") refresh(true);
  if(t.id==="logoutBtn") logout();
  if(t.id==="themeBtn"){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";}
});
document.addEventListener("change",e=>{ if(e.target.id==="pdfIn") $("#pdfName").textContent=e.target.files[0]?.name||""; });
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="chatIn"&&!e.shiftKey){e.preventDefault();const v=e.target.value;e.target.value="";ask(v);}
  if(e.key==="Enter"&&e.target.matches("tr[tabindex]")) e.target.click();
  if(e.key==="Enter"&&e.target.id==="q"){
    const q=e.target.value.trim().toUpperCase(); if(!q) return;
    if(DATA.portfolio.positions.some(p=>p.t===q)){STATE.pfSel=q;STATE.pfTab="Danh mục hiện tại";go("portfolio");}
    else if(DATA.reports.some(r=>r.stocks.some(s=>s.t===q)||r.broker.toUpperCase().includes(q))){go("reports");}
    else if(/QUỸ|FUND|VFM|VCBF|SSIAM/.test(q)) go("funds");
  }
});

/* ============ boot ============ */
function paintHeader(){
  const d=new Date(DATA.asOf);
  $("#dateTxt").textContent=d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"});
  $("#dowTxt").innerHTML=d.toLocaleDateString("vi-VN",{weekday:"long"}).replace(/^./,c=>c.toUpperCase())+
    ` · <button class="link" id="refreshBtn" style="margin:0;padding:0" title="Cập nhật lúc ${esc(DATA.meta?.generatedAt||"")}">Tải lại</button>`;
  $("#userAvatar").textContent=(CURRENT_USER?.username||"C").slice(0,1).toUpperCase();
}
async function logout(){
  try{ await api("/api/auth/logout",{}); }catch(e){} finally{ location.assign("/login"); }
}
async function refresh(force){
  try{
    const d=await loadData();
    if(force||!DATA||d.meta?.generatedAt!==DATA.meta?.generatedAt){ DATA=d; paintHeader(); render(); }
  }catch(e){ if(!DATA) $("#page").innerHTML=`<div class="card"><h2>Không tải được dữ liệu</h2><p class="prose">${esc(e.message)}. Chạy <code>python pipeline/run.py</code> để tạo file dữ liệu, rồi tải lại trang.</p></div>`; }
}
(async function boot(){
  const h=location.hash.slice(1); if(PAGES.some(p=>p.id===h)) STATE.page=h;
  $("#page").innerHTML='<div class="card empty">Đang tải dữ liệu…</div>';
  await refresh(true);
  try{
    const health=await api("/api/health");
    const auth=await api("/api/auth/me");
    API_OK=!!health.ok; CURRENT_USER=auth.user; CSRF_TOKEN=auth.csrfToken||"";
    if(STATE.page==="admin"&&!can("admin")) STATE.page="overview";
    paintHeader(); render();
  }catch(e){ API_OK=false; }
  if(CFG.REFRESH_MINUTES>0) setInterval(()=>refresh(false), CFG.REFRESH_MINUTES*60000);
  window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(PAGES.some(p=>p.id===h)&&h!==STATE.page&&!(h==="admin"&&!can("admin"))){STATE.page=h;render();}});
})();
</script>
