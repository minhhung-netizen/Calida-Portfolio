<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calida Analyst System</title>
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --panel:#FFFFFF; --panel-2:#F1F5F9; --line:#D9E2EF;
  --ink:#132044; --ink-2:#334155; --muted:#52657F;
  --brand:#1F5EEA; --brand-soft:#E3EDFF; --on-brand:#FFFFFF;
  --up:#087A3E; --up-soft:#E3F6EA; --down:#BE1E2D; --down-soft:#FDE7EA;
  --warn:#9A5B00; --warn-soft:#FFF1DE; --neutral-soft:#E9EEF5;
  --shadow:0 1px 2px rgba(20,48,120,.05),0 4px 16px rgba(20,48,120,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090909; --panel:#121212; --panel-2:#1C1C1C; --line:#343434;
    --ink:#F5F5F5; --ink-2:#D4D4D4; --muted:#A3A3A3;
    --brand:#91B4FF; --brand-soft:#1D2635; --on-brand:#090909;
    --up:#5EEA92; --up-soft:#10291A; --down:#FF7B86; --down-soft:#35171A;
    --warn:#FFC15A; --warn-soft:#3D2C10; --neutral-soft:#262626;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#090909; --panel:#121212; --panel-2:#1C1C1C; --line:#343434;
  --ink:#F5F5F5; --ink-2:#D4D4D4; --muted:#A3A3A3;
  --brand:#91B4FF; --brand-soft:#1D2635; --on-brand:#090909;
  --up:#5EEA92; --up-soft:#10291A; --down:#FF7B86; --down-soft:#35171A;
  --warn:#FFC15A; --warn-soft:#3D2C10; --neutral-soft:#262626;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:8px;padding:0 10px 26px}
.logo b{font-size:26px;letter-spacing:-.5px;color:var(--ink)}
.logo small{display:block;font-size:8.5px;font-weight:600;letter-spacing:.8px;color:var(--ink-2);margin-top:-4px}
nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:10px;padding:11px 14px;margin-bottom:4px;font-size:15px;color:var(--ink-2);text-align:left}
nav button:hover{background:var(--panel-2)}
nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
nav svg{width:20px;height:20px;flex:none}
.nav-foot{margin-top:auto}
main{padding:20px 28px 40px;min-width:0;max-width:1800px;width:100%}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.search{flex:0 1 440px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink);font:inherit}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--ink-2)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.icon-btn{background:none;border:0;padding:10px;border-radius:8px;min-width:40px;min-height:40px;display:inline-grid;place-items:center}
.menu-btn{display:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;min-width:44px;min-height:44px;padding:10px}
.drawer-close{display:none}
.nav-scrim{display:none}
h1{font-size:30px;line-height:1.15;margin:4px 0 2px;letter-spacing:-.6px}
.sub{color:var(--ink-2);font-size:15px;margin:0 0 16px}
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2{font-size:17px;margin:0;font-weight:600}
.ic{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.ic svg{width:18px;height:18px}
.link{margin-left:auto;background:none;border:0;color:var(--brand);font-size:13px;white-space:nowrap}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.4px}
.kpi .l{color:var(--ink-2);font-size:13px}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.bg-up{background:var(--up-soft);color:var(--up)} .bg-down{background:var(--down-soft);color:var(--down)}
.bg-warn{background:var(--warn-soft);color:var(--warn)} .bg-brand{background:var(--brand-soft);color:var(--brand)} .bg-neutral{background:var(--neutral-soft);color:var(--ink-2)}
.tag{display:inline-block;border-radius:7px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip{display:inline-block;border-radius:999px;padding:5px 14px;font-size:13px;background:var(--brand-soft);color:var(--brand);margin:0 6px 6px 0}
.chip.risk{background:var(--down-soft);color:var(--down)}
.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:9px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:0;background:var(--panel-2);border-radius:9px;padding:7px 10px;color:var(--ink-2);font-size:13px}
.seg button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tbl-wrap{overflow-x:auto;overscroll-behavior-inline:contain;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;background:var(--panel-2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--panel-2)}
tr.sel td{background:var(--brand-soft)}
.t{font-weight:700}
.box{background:var(--panel-2);border-radius:10px;padding:10px 14px}
.box .l{font-size:13px;color:var(--ink-2)}
.box .v{font-size:20px;font-weight:700}
.prose{color:var(--ink-2);line-height:1.65;margin:10px 0 0;max-width:72ch}
.bar{height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.row{display:flex;align-items:center;gap:10px}
.list li{margin-bottom:8px}
.list{padding-left:18px;margin:0;color:var(--ink-2)}
.list li::marker{color:var(--brand)}
.label-sm{font-size:13px;color:var(--ink-2);margin:12px 0 6px;display:flex;gap:8px;align-items:center}
.span-2{grid-column:span 2}
.demo{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-left:8px;vertical-align:middle;font-weight:600}
.heat{display:grid;grid-template-columns:80px repeat(5,minmax(0,1fr));gap:4px;font-size:12px;align-items:center}
.heat div.c{height:24px;border-radius:4px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;flex:1;background:var(--panel-2)}
.stack i{display:block;height:100%}
/* reports + chat */
.chat{display:flex;flex-direction:column;height:min(640px,70vh)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.msg{padding:10px 13px;border-radius:12px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--on-brand)}
.msg.a{align-self:flex-start;background:var(--panel-2);color:var(--ink)}
.msg.err{background:var(--down-soft);color:var(--down)}
.composer{display:flex;gap:8px;margin-top:10px}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;height:44px}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--brand);color:var(--on-brand);font-weight:600}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.suggest button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;margin:0 6px 6px 0;color:var(--ink-2)}
dialog{border:0;border-radius:16px;padding:0;max-width:720px;max-height:90vh;overflow:auto;width:92vw;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(8,18,50,.45)}
.dlg{padding:20px 22px}
.dlg textarea,.dlg input,.dlg select{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.dlg textarea{height:220px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.detail dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:13.5px}
.detail dt{color:var(--ink-2)} .detail dd{margin:0;text-align:right;font-weight:600}
.empty{color:var(--muted);padding:14px 0}
.data-state{font-size:12px}
.toast{position:fixed;z-index:20;right:20px;bottom:20px;max-width:min(420px,calc(100vw - 40px));padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;font-weight:500}
.toast.ok{background:var(--up-soft);color:var(--up);border:1px solid var(--up)}
.toast.err{background:var(--down-soft);color:var(--down);border:1px solid var(--down)}
/* Reusable layouts: tables scroll only inside their own cards. */
.cols-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cols-auto-220{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.cols-auto-200{grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr))}
.cols-auto-180{grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))}
.cols-auto-150{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.cols-auto-300{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.cols-auto-340{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.cols-auto-380{grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}
.cols-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.page-tabs{margin-top:2px}
.asof{display:inline-flex;align-items:center;gap:5px;margin:0 0 14px;color:var(--muted);font-size:12.5px}
.asof::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.section-tabs{margin-bottom:14px}
.reports-chat{position:sticky;top:14px}
.check-cell input{inline-size:18px;block-size:18px;accent-color:var(--brand);vertical-align:middle}
.permission-matrix{table-layout:fixed}
.permission-matrix th,.permission-matrix td{white-space:normal;overflow-wrap:anywhere}
.permission-matrix th:first-child{width:50%}
.permission-matrix th:not(:first-child){width:25%;text-align:center}
.permission-matrix .check-cell{text-align:center;padding:4px}
.permission-toggle{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;cursor:pointer}
.permission-toggle input{padding:0;margin:0}
.actions-danger{color:var(--down)!important}
.work-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.work-filters input,.work-filters select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px;min-height:40px}
.work-filters input{min-width:min(220px,100%)}
.action-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.action-summary button{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:15px;text-align:left;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;min-height:90px}
.action-summary button:hover{border-color:var(--brand);background:var(--brand-soft)}
.action-summary .num{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.action-summary .caption{font-size:13px;color:var(--ink-2);margin-top:4px}
.action-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,330px);gap:14px;align-items:start}
.action-side{display:grid;gap:14px;position:sticky;top:14px}.action-side .card{padding:14px}.action-side table td{padding:8px 6px}.action-side table th{padding:7px 6px}
.action-reminder{border-left:4px solid var(--warn);padding:12px 14px;margin-bottom:14px}.action-reminder .btn{margin-left:auto}
.action-kpi{display:flex;align-items:center;gap:10px}.action-kpi .badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}.action-kpi .badge svg{width:21px;height:21px}
.progress-cell{min-width:104px}.progress-cell .muted{font-size:11.5px}.action-more{min-width:40px;min-height:40px;border:0;border-radius:8px;background:transparent;color:var(--brand);font-weight:700;font-size:18px}.action-more:hover{background:var(--brand-soft)}
.side-list{list-style:none;margin:0;padding:0}.side-list li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.side-list li:last-child{border-bottom:0}.side-list .link{padding:2px;margin-left:auto}.side-list .muted{font-size:12px}
.status-flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:13px;margin-top:8px}
.status-flow span{background:var(--panel-2);padding:4px 9px;border-radius:7px}.status-flow b{color:var(--muted)}
.progress-line{display:block;width:70px;height:5px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-top:5px}.progress-line i{display:block;height:100%;background:var(--brand);border-radius:inherit}
.signal-strength{display:inline-flex;align-items:flex-end;gap:2px;height:14px;vertical-align:middle}.signal-strength i{width:5px;height:5px;border-radius:2px;background:var(--line)}.signal-strength i:nth-child(2){height:9px}.signal-strength i:nth-child(3){height:13px}.signal-strength i.on{background:var(--brand)}
.work-actions{display:flex;gap:6px;flex-wrap:wrap}.work-actions .btn{padding:7px 10px;font-size:12.5px}.work-empty{padding:22px 8px;text-align:center;color:var(--muted)}
@media (max-width:1100px){main{padding:18px 20px 32px}.cols-2-1,.action-layout{grid-template-columns:1fr}.reports-chat,.action-side{position:static}.span-2{grid-column:auto}.action-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.app{display:block}.menu-btn{display:inline-grid;place-items:center}aside{position:fixed;z-index:100;inset:0 auto 0 0;width:min(304px,86vw);height:100dvh;padding:20px 14px;transform:translateX(-105%);transition:transform 180ms ease;box-shadow:var(--shadow)}body.nav-open aside{transform:translateX(0)}.nav-scrim{position:fixed;z-index:90;inset:0;border:0;background:rgba(8,18,50,.42)}body.nav-open .nav-scrim{display:block}.logo{padding-bottom:20px}.drawer-close{display:inline-grid;margin-left:auto}nav{display:block}nav button{min-height:44px}.nav-foot{display:block}.topbar{gap:10px}.topbar .right{gap:10px}.topbar .right .date{display:none}}
@media (max-width:860px){aside{visibility:hidden;pointer-events:none}body.nav-open aside{visibility:visible;pointer-events:auto}}
@media (max-width:600px){body{font-size:14px}main{padding:12px 12px 28px}.topbar{align-items:stretch;flex-wrap:wrap;margin-bottom:16px}.search{order:2;flex:1 0 100%;min-width:0;padding:10px 14px}.topbar .right{margin-left:auto}.topbar .right #logoutBtn{font-size:12px;padding:0}.avatar{width:36px;height:36px}.data-state{display:none}h1{font-size:24px}.sub{font-size:14px;margin-bottom:14px}.card{padding:14px}.card-h{align-items:flex-start}.card-h h2{font-size:16px}.kpi .v{font-size:23px}.cols-1-1,.action-summary{grid-template-columns:1fr}.cols-auto-340,.cols-auto-380{grid-template-columns:1fr}.tabs{display:flex;width:100%;overflow-x:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap;flex:0 0 auto;min-height:40px}.seg button{min-height:40px}.row{min-width:0;flex-wrap:wrap}.row>*{min-width:0}.chat{height:62vh;min-height:380px}.composer{align-items:stretch;flex-wrap:nowrap}.composer .btn{min-width:56px;padding-inline:12px}.fgrid{grid-template-columns:1fr}.dlg input,.dlg select,.dlg textarea,.composer textarea{font-size:16px}.work-filters input,.work-filters select{flex:1 1 100%;width:100%}.action-summary button{min-height:78px}.toast{right:12px;bottom:12px;max-width:calc(100vw - 24px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside id="appNav">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><g fill="var(--brand)"><circle cx="20" cy="20" r="4"/><g id="pet"><ellipse cx="20" cy="8" rx="3.4" ry="6.5"/></g><use href="#pet" transform="rotate(45 20 20)"/><use href="#pet" transform="rotate(90 20 20)"/><use href="#pet" transform="rotate(135 20 20)"/><use href="#pet" transform="rotate(180 20 20)"/><use href="#pet" transform="rotate(225 20 20)"/><use href="#pet" transform="rotate(270 20 20)"/><use href="#pet" transform="rotate(315 20 20)"/></g></svg>
      <div><b>Calida</b><small>ASSET MANAGEMENT</small></div>
      <button class="icon-btn drawer-close" id="navClose" aria-label="Đóng menu điều hướng"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <nav id="nav" aria-label="Điều hướng chính"></nav>
    <div class="nav-foot"><nav><button id="themeBtn">Đổi giao diện sáng/tối</button></nav></div>
  </aside>
  <button class="nav-scrim" id="navScrim" aria-label="Đóng menu điều hướng" tabindex="-1"></button>
  <main>
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Mở menu điều hướng" aria-controls="nav" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Tìm mã cổ phiếu, báo cáo, quỹ đầu tư…" aria-label="Tìm kiếm"></label>
      <div class="right"><div class="date"><b id="dateTxt"></b><div class="muted" id="dowTxt"></div></div><div id="dataState" class="tag data-state bg-neutral" title="Trạng thái dữ liệu">Đang tải dữ liệu</div><button class="icon-btn" id="notificationBtn" aria-label="Cài đặt thông báo" title="Cài đặt thông báo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button><button class="link" id="logoutBtn" title="Đăng xuất">Đăng xuất</button><div class="avatar" id="userAvatar">C</div></div>
    </div>
    <div id="page"></div>
  </main>
</div>

  const asOf=new Date(`${raw}T00:00:00`), today=new Date(); today.setHours(0,0,0,0);

const pushSupported=()=>Boolean(window.isSecureContext&&"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window);
const isInstalledPwa=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function base64UrlToUint8Array(value){
  const padding="=".repeat((4-value.length%4)%4), base64=(value+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(base64); return Uint8Array.from(raw,c=>c.charCodeAt(0));
}
function pushPreferencesFromDialog(){
  return Object.fromEntries(["signals","actions","pipeline"].map(key=>[key,!!$(`#notificationBody [data-push-pref="${key}"]`)?.checked]));
}
function paintNotificationButton(){
  const button=$("#notificationBtn"); if(!button) return;
  const label=!pushSupported()?"Thông báo không được trình duyệt hỗ trợ":!PUSH_CONFIG.available?"Thông báo đang chờ cấu hình máy chủ":PUSH_DEVICE_SUBSCRIBED?"Thông báo đang bật trên thiết bị này":"Bật thông báo";
  button.setAttribute("aria-label",label); button.title=label;

}
async function setupPush(){
  if(!pushSupported()) { paintNotificationButton(); return; }
  try{
    PUSH_REGISTRATION=await navigator.serviceWorker.register("/sw.js",{scope:"/"});
    const subscription=await PUSH_REGISTRATION.pushManager.getSubscription();
    PUSH_DEVICE_SUBSCRIBED=Boolean(subscription);
  }catch(error){ console.warn("Không đăng ký được service worker",error); }
  if(API_OK){
    try{ PUSH_CONFIG=await api("/api/notifications/config"); }
    catch(error){ console.warn("Không tải được cấu hình thông báo",error); }

async function enableNotifications(){
  const button=$("#enableNotifications"); if(button) button.disabled=true;
  try{
    if(!pushSupported()) throw new Error("Trình duyệt này chưa hỗ trợ thông báo");
    if(!PUSH_CONFIG.available||!PUSH_CONFIG.publicKey) throw new Error("Máy chủ chưa được cấu hình Web Push");
    const permission=Notification.permission==="granted"?"granted":await Notification.requestPermission();
    if(permission!=="granted") throw new Error("Bạn chưa cho phép nhận thông báo. Hãy cho phép khi trình duyệt yêu cầu.");
    PUSH_REGISTRATION=PUSH_REGISTRATION||await navigator.serviceWorker.register("/sw.js",{scope:"/"});
    let subscription=await PUSH_REGISTRATION.pushManager.getSubscription();
    if(!subscription) subscription=await PUSH_REGISTRATION.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:base64UrlToUint8Array(PUSH_CONFIG.publicKey)});
    const result=await api("/api/notifications/subscriptions",{subscription:subscription.toJSON(),preferences:pushPreferencesFromDialog()});
    PUSH_CONFIG={...PUSH_CONFIG,subscribed:true,preferences:result.preferences}; PUSH_DEVICE_SUBSCRIBED=true; paintNotificationButton(); $("#notificationDlg").close(); notify("Đã bật thông báo cho thiết bị này.");
  }catch(error){ notify(error.message,"err"); if(button) button.disabled=false; }
}
async function disableNotifications(){
  const button=$("#disableNotifications"); if(button) button.disabled=true;
  try{
    const subscription=await PUSH_REGISTRATION?.pushManager.getSubscription();
    if(subscription){ await api("/api/notifications/subscriptions",{endpoint:subscription.endpoint},"DELETE"); await subscription.unsubscribe(); }
    PUSH_DEVICE_SUBSCRIBED=false; await setupPush(); $("#notificationDlg").close(); notify("Đã tắt thông báo trên thiết bị này.");
  }catch(error){ notify("Không thể tắt thông báo: "+error.message,"err"); if(button) button.disabled=false; }
}
async function testNotification(){
  const button=$("#testNotification"); if(button) button.disabled=true;
  try{const result=await api("/api/notifications/test",{}); notify(`Đã gửi thử ${result.delivered} thông báo.`);}

}

function spark(vals, w=180, h=56){
  const mn=Math.min(...vals), mx=Math.max(...vals), sx=w/(vals.length-1);
  const pts=vals.map((v,i)=>[i*sx, h-4-(v-mn)/(mx-mn||1)*(h-10)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${w} ${h} L0 ${h}Z" fill="var(--up)" opacity=".10"/><path d="${d}" fill="none" stroke="var(--up)" stroke-width="2"/></svg>`;
}

}

/* ============ computed: portfolio signals ============
   Quy tắc theo hệ thống danh mục:
   - Về vùng mua: Low trong [vùng mua thấp, vùng mua cao]
   - Đạt mục tiêu: giá ≥ giá mục tiêu
   - Cần xử lý: giá ≤ vùng vi phạm
   - Sát vùng vi phạm: giá ≤ vùng vi phạm × 1,03 */
function signals(p){
  const out=[];
  if(p.price==null) return out;
  if(p.price<=p.stop) out.push("Cần xử lý");
  else if(p.price<=p.stop*1.03) out.push("Sát vùng vi phạm");
  if(p.buy && p.low>=p.buy[0] && p.low<=p.buy[1] && (p.status==="MUA"||p.status==="THEO DÕI")) out.push("Về vùng mua");
  if(p.price>=p.target) out.push("Đạt target");
  return out;
}
const perf = p => p.cost && p.price!=null ? (p.price/p.cost-1)*100 : null;
function portfolioStats(){
  const P=DATA.portfolio.positions, c={"Cần xử lý":0,"Sát vùng vi phạm":0,"Về vùng mua":0,"Đạt target":0};
  P.forEach(p=>signals(p).forEach(s=>c[s]++));
  const open=P.filter(p=>p.status!=="THEO DÕI").length;
  const flagged=new Set(P.filter(p=>signals(p).length).map(p=>p.t));
  const bySector={}; P.filter(p=>p.w>0).forEach(p=>bySector[p.sector]=(bySector[p.sector]||0)+p.w);
  return {c,open,other:P.length-flagged.size,bySector};
}

const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
function repAgg(list){
  const brokers={};
  [...list].sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{
    const b=brokers[r.broker] ||= {broker:r.broker,n:0,latest:r,ow:new Set(),targets:[]};
    b.n++; r.ow.forEach(s=>b.ow.add(s)); if(r.vnTarget && !b.target) b.target=r.vnTarget;
  });
  const stanceCnt={"Tích cực":0,"Trung lập":0,"Thận trọng":0,"Tiêu cực":0};
  Object.values(brokers).forEach(b=>stanceCnt[b.latest.stance]=(stanceCnt[b.latest.stance]||0)+1);
  const sectors={};
  list.forEach(r=>{r.ow.forEach(s=>{(sectors[s] ||= {ow:new Set(),uw:new Set()}).ow.add(r.broker)}); r.uw.forEach(s=>{(sectors[s] ||= {ow:new Set(),uw:new Set()}).uw.add(r.broker)})});
  const stocks={};
  [...list].sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>r.stocks.forEach(s=>{
    const o=stocks[s.t] ||= {t:s.t,calls:{}}; if(!o.calls[r.broker]) o.calls[r.broker]={rec:s.rec,target:s.target,date:r.date};
  }));
  const risks={};
  list.forEach(r=>r.risks.forEach(k=>{const o=risks[k.k] ||= {k:k.k,n:0,sev:0,brokers:new Set()}; o.n++; o.sev=Math.max(o.sev,k.s); o.brokers.add(r.broker);}));
  const targets=Object.values(brokers).map(b=>b.target).filter(Boolean);
  return {brokers:Object.values(brokers).sort((a,b)=>b.n-a.n),stanceCnt,sectors,stocks:Object.values(stocks),risks:Object.values(risks).sort((a,b)=>b.brokers.size*b.sev-a.brokers.size*a.sev||b.n-a.n),
    vnMed:median(targets),vnMin:targets.length?Math.min(...targets):null,vnMax:targets.length?Math.max(...targets):null};
}

let navOpener=null;
function setNav(open){
  const menu=$("#menuBtn"), scrim=$("#navScrim"), drawer=$("#appNav");
  if(!matchMedia("(max-width:860px)").matches) return;
  if(open) navOpener=document.activeElement;
  document.body.classList.toggle("nav-open",open);
  if(drawer){ drawer.inert=!open; drawer.setAttribute("aria-hidden",String(!open)); }
  if(menu){ menu.setAttribute("aria-expanded",String(open)); menu.setAttribute("aria-label",open?"Đóng menu điều hướng":"Mở menu điều hướng"); }
  if(scrim) scrim.tabIndex=open?0:-1;
  if(open) setTimeout(()=>$("#nav button, #themeBtn")?.focus(),0);
  if(!open&&navOpener?.focus) navOpener.focus();
}
function syncNav(){
  const drawer=$("#appNav");
  if(!drawer) return;
  if(matchMedia("(max-width:860px)").matches) setNav(false);
  else { document.body.classList.remove("nav-open"); drawer.inert=false; drawer.setAttribute("aria-hidden","false"); }
}
function go(id){ if(!canView(id)) return; setNav(false); STATE.page=id; location.hash=id; render(); window.scrollTo({top:0}); }

  if(!pages.some(p=>p.id===STATE.page)) STATE.page=pages[0].id;
  renderNav();

}

function latestFlowValues(flows){
  if(flows.asOf) return flows.investors["Hôm nay"];

function flowDateLabel(flows){

}

    const bottom=`<div class="grid cols-auto-300" style="margin-top:14px">
      <div class="card">${head("pie","Phân bổ tài sản")}${donut(Object.entries(P.alloc).map(([k,v])=>({k,v})),"100%","Tổng tài sản")}</div>
      <div class="card">${head("alert","Theo dõi vận động giá")}
        ${[["Cần xử lý","bg-down"],["Sát vùng vi phạm","bg-warn"],["Về vùng mua","bg-brand"],["Đạt target","bg-up"]].map(([k,c])=>`<div class="row box ${c}" style="margin-bottom:8px;padding:8px 12px"><span style="flex:1">${k}</span><b>${st.c[k]} mã</b></div>`).join("")}
        <div class="row box" style="padding:8px 12px"><span style="flex:1">Không có cảnh báo</span><b>${st.other} mã</b></div></div>
      ${detail}</div>`;
    body = STATE.pfTab==="Tổng quan"
      ? `<div class="grid cols-2-1" style="margin-top:14px">${table}${side}</div>${bottom}`
      : `<div class="grid cols-2-1" style="margin-top:14px">${table}${detail}</div>`;
  }
  return `<h1>Danh mục khuyến nghị</h1><p class="sub">Cập nhật liên tục, kỷ luật trong phân tích, chủ động trong hành động</p>${sectionStamp("portfolio", "Giá và danh mục đến")}${tabs}${kpis}${body}`;
}

  const tot=Object.values(cur).reduce((s,v)=>s+Math.abs(v||0),0)||1;
  const latestLabel=flowDateLabel(F), flowLabel=latestLabel?`Dữ liệu ${latestLabel}.`:"Chưa có dữ liệu dòng tiền.";
  const icons={"Khối ngoại":"flow","Tự doanh":"users","Cá nhân":"users","Tổ chức":"brief"};
  const kpis=`<div class="grid cols-auto-220">${["Khối ngoại","Tự doanh","Cá nhân","Tổ chức"].map(k=>`<div class="card kpi"><div class="badge ${today[k]<0?"bg-down":"bg-up"}">${svg(icons[k])}</div><div><div class="l">${k}</div><div class="v ${cls(today[k])}">${sgn(today[k])} tỷ</div><div class="l">Lũy kế tháng: <b class="${cls(mtd[k])}">${sgn(mtd[k])} tỷ</b></div></div></div>`).join("")}</div>`;
  const buys=F.tickers.filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,10), sells=F.tickers.filter(x=>x.v<0).sort((a,b)=>a.v-b.v).slice(0,10);
  const rank=(rows)=>`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Mã</th><th class="num">Giá trị (tỷ)</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td class="t">${esc(x.t)}</td><td class="num ${cls(x.v)}">${sgn(x.v)}</td></tr>`).join("")}</tbody></table></div>`;
  const H=F.history, heatColor=v=>v>=300?"var(--up)":v>0?"color-mix(in srgb,var(--up) 35%,transparent)":v>-200?"color-mix(in srgb,var(--down) 30%,transparent)":"var(--down)";
  const tagInv=k=>`<span class="tag ${k==="Cá nhân"?"bg-up":k==="Khối ngoại"?"bg-brand":k==="Tự doanh"?"bg-down":"bg-warn"}">${esc(k)}</span>`;

  return `<h1>Dòng tiền thị trường</h1><p class="sub">Theo dõi dòng tiền của các nhóm nhà đầu tư và xu hướng vận động vốn trên thị trường</p>${sectionStamp("flows", "Dòng tiền đến")}${kpis}
  <div class="grid cols-auto-300" style="margin-top:14px">
    <div class="card">${head("users","Phân loại nhà đầu tư")}
      <div class="seg">${[["Hôm nay",latestLabel?latestLabel.replace(/^phiên /,"Phiên "):"Phiên gần nhất"],["MTD","Từ đầu tháng"],["YTD","Từ đầu năm"]].map(([k,l])=>`<button data-invtab="${k}" aria-selected="${STATE.invTab===k}">${l}</button>`).join("")}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Nhà đầu tư</th><th class="num">Giá trị (tỷ)</th><th class="num">Tỷ trọng</th><th>Xu hướng</th></tr></thead><tbody>
      ${Object.entries(cur).map(([k,v])=>`<tr><td>${k}</td><td class="num ${cls(v)}"><b>${sgn(v)}</b></td><td class="num">${nf(Math.abs(v)/tot*100,1)}%</td><td style="min-width:100px"><div class="bar"><i style="width:${Math.abs(v)/tot*100}%;background:${v>0?"var(--up)":"var(--down)"}"></i></div></td></tr>`).join("")}</tbody></table></div>
      <p class="muted" style="font-size:12px;margin:8px 0 0">Tỷ trọng = |giá trị ròng| / tổng |giá trị ròng| của 4 nhóm.</p></div>
    <div class="card">${head("trend","Top mua ròng")}${rank(buys)}</div>
    <div class="card">${head("flow","Top bán ròng")}${rank(sells)}</div>
  </div>
  <div class="grid cols-auto-340" style="margin-top:14px">
    <div class="card">${head("pie","Dòng tiền theo ngành")}<div class="tbl-wrap"><table><thead><tr><th>Ngành</th><th class="num">Giá trị (tỷ)</th><th class="num">Thay đổi</th><th class="num">Tỷ trọng GTGD</th></tr></thead><tbody>
      ${bySector.map(s=>`<tr><td>${esc(s.s)}</td><td class="num ${cls(s.v)}">${sgn(s.v)}</td><td class="num ${cls(s.chg)}">${sgn(s.chg,1,"%")}</td><td class="num">${nf(s.w,1)}%</td></tr>`).join("")}</tbody></table></div></div>
    <div class="card">${head("brief","Dòng tiền theo cổ phiếu")}<div class="tbl-wrap"><table><thead><tr><th>Mã</th><th class="num">Giá trị (tỷ)</th><th>NĐT chính</th><th>Ghi chú</th></tr></thead><tbody>
      ${[...F.tickers].sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,10).map(x=>`<tr><td class="t">${esc(x.t)}</td><td class="num ${cls(x.v)}">${sgn(x.v)}</td><td>${tagInv(x.main)}</td><td class="muted">${esc(x.note||"—")}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="grid">
      <div class="card">${head("cal","Diễn biến 5 phiên theo nhóm NĐT")}
        <div class="heat"><div></div>${H.dates.map(d=>`<div class="muted" style="text-align:center">${d}</div>`).join("")}
        ${["Cá nhân","Tổ chức","Tự doanh","Khối ngoại"].map(k=>`<div>${k}</div>${H[k].map((v,i)=>`<div class="c" style="background:${heatColor(v)}" title="${k} ${H.dates[i]}: ${sgn(v)} tỷ"></div>`).join("")}`).join("")}</div>
        <div class="row muted" style="font-size:11.5px;margin-top:10px;flex-wrap:wrap;gap:12px"><span>■ <span class="up">Mua ≥ 300 tỷ</span></span><span>Mua nhẹ</span><span>Bán nhẹ</span><span class="down">■ Bán ≥ 200 tỷ</span></div></div>
      <div class="card">${head("target",latestLabel?"Điểm nhấn phiên gần nhất":"Điểm nhấn dòng tiền")}<ul class="list">${latestLabel?`
        <li>Cá nhân ${today["Cá nhân"]>0?"mua":today["Cá nhân"]<0?"bán":"cân bằng"} ròng ${sgn(today["Cá nhân"])} tỷ${topIn?`, tập trung vào ${topIn}`:""}.</li>
        <li>Khối ngoại ${today["Khối ngoại"]>0?"mua":today["Khối ngoại"]<0?"bán":"cân bằng"} ròng ${sgn(today["Khối ngoại"])} tỷ${foreignSells?`, tập trung ở ${foreignSells}`:""}.</li>
        <li>Lũy kế tháng, khối ngoại ${mtd["Khối ngoại"]<0?"bán":mtd["Khối ngoại"]>0?"mua":"cân bằng"} ròng ${nf(Math.abs(mtd["Khối ngoại"]))} tỷ.</li>`:"<li>Chưa có dữ liệu dòng tiền để tạo điểm nhấn.</li>"}</ul></div>
    </div>
  </div>`;
}

  <div class="card"><div class="grid cols-auto-150">

    ${kp(hasPrev?sgn(f.dStockW,2," đ.%"):"—","Δ tỷ trọng CP",cls(f.dStockW))}${kp(hasPrev?sgn(f.dStockVal)+" tỷ":"—","Δ giá trị CP",cls(f.dStockVal))}</div>

  <div class="grid cols-auto-300" style="margin-top:14px">

      <li><b>Giảm mạnh nhất:</b> ${secDelta.filter(s=>s.d<0).slice(0,2).map(s=>`${esc(s.s)} (${sgn(s.d,2)} đ.%)`).join(", ")||"không có"}.</li>
      <li><b>NAV ${sgn(f.navPrevChgPct,1,"%")}</b> (${sgn(f.navPrevChg)} tỷ) trên nhóm quỹ có đủ 2 kỳ; tỷ trọng cổ phiếu ${sgn(f.dStockW,2)} đ.%.</li>`:"<li>Cần thêm kỳ trước để so sánh biến động.</li>"}
      <li><b>Trùng với Calida:</b> ${f.stocks.filter(s=>priceOf(s.t)).map(s=>esc(s.t)).join(", ")||"không có mã nào"} nằm trong top nắm giữ của quỹ mở.</li>
      ${f.updated<f.total?`<li><b>Còn thiếu:</b> ${f.total-f.updated} quỹ chưa có báo cáo kỳ ${f.period}.</li>`:""}</ul></div>
  </div>`;
}

  const brokerTbl=`<div class="card">${head("users","Quan điểm theo công ty chứng khoán")}<div class="tbl-wrap"><table><thead><tr><th>CTCK</th><th class="num">Số BC</th><th>Quan điểm</th><th class="num">Mục tiêu VN-Index</th><th class="num">so với hiện tại</th><th>Ngành ưu tiên</th><th>Báo cáo mới nhất</th></tr></thead><tbody>
    ${A.brokers.map(b=>{const up=b.target?(b.target/DATA.market.index-1)*100:null; return `<tr class="click" data-rsel="${esc(b.latest.id)}"><td class="t">${esc(b.broker)}</td><td class="num">${b.n}</td><td>${statusTag(b.latest.stance)}</td><td class="num">${nf(b.target)}</td><td class="num ${cls(up)}">${up==null?"—":sgn(up,1,"%")}</td><td style="white-space:normal;min-width:160px">${esc([...b.ow].slice(0,3).join(", "))||"—"}</td><td style="white-space:normal;min-width:180px">${esc(b.latest.title)}<div class="muted" style="font-size:12px">${fmtD(b.latest.date)}</div></td></tr>`}).join("")||`<tr><td colspan="7" class="empty">Không có báo cáo trong bộ lọc này.</td></tr>`}</tbody></table></div></div>`;

  const sel=list.find(r=>r.id===STATE.repSel);

    <div class="tbl-wrap"><table><thead><tr><th>Ngày</th><th>CTCK</th><th>Loại</th><th>Tiêu đề</th><th>Quan điểm</th></tr></thead><tbody>

  const summary=`<div class="grid">${brokerTbl}${riskCard}<div class="grid cols-auto-340">${secCard}${stockCard}</div></div>`;

/* ============ Khuyến nghị hành động + Trung tâm tín hiệu ============
   Không tạo thêm dữ liệu thị trường: hành động lấy từ portfolio.today, tín hiệu
   tổng hợp từ danh mục và các báo cáo CTCK hiện có. Trạng thái thao tác được
   lưu qua API riêng và tuân theo quyền từng module. */
const workspace = () => DATA.workspace || {actions:{},signals:{}};
const actionStatus = {
  pending:{label:"Cần xử lý",className:"bg-down"}, waiting:{label:"Chờ điều kiện giá",className:"bg-warn"},
  completed:{label:"Hoàn thành",className:"bg-up"}, cancelled:{label:"Đã hủy",className:"bg-neutral"},
};
const signalStatus = {
  new:{label:"Mới",className:"bg-brand"}, watch:{label:"Theo dõi",className:"bg-warn"}, dismissed:{label:"Đã bỏ qua",className:"bg-neutral"},
};
function stateTag(status, source){ const s=(source==="signal"?signalStatus:actionStatus)[status]||actionStatus.pending; return `<span class="tag ${s.className}">${s.label}</span>`; }
function actionRows(){
  const positions=DATA.portfolio?.positions||[], stored=workspace().actions||{};
  return (DATA.portfolio?.today||[]).map(item=>{
    const p=positions.find(row=>row.t===item.t), id=`portfolio:${item.t}`;
    const saved=stored[id]||{};
    const automatic=p?.buy&&p.price!=null&&p.price<p.buy[0]?"waiting":"pending";
    const planned=Number.isSafeInteger(saved.plannedQuantity)?saved.plannedQuantity:null;
    const completed=Number.isSafeInteger(saved.completedQuantity)?saved.completedQuantity:null;
    return {id,t:item.t,action:item.a,zone:p?.buy?range(p.buy):item.z||"—",price:p?.price??null,chg:p?.chg??null,
      sector:p?.sector||"Chưa rõ ngành",context:p?.thesis||"Khuyến nghị danh mục",status:saved.status||automatic, source:"Danh mục", sourceDetail:p?.book||"Danh mục",
      plannedQuantity:planned,completedQuantity:completed,deadline:saved.deadline||null,note:saved.note||""};
  });
}
const actionQty=v=>v==null?"—":nf(v,0);
function actionProgress(row){
  if(row.plannedQuantity==null) return '<span class="muted">Chưa khai báo</span>';
  const done=Math.min(row.completedQuantity||0,row.plannedQuantity), pct=row.plannedQuantity?Math.round(done/row.plannedQuantity*100):0;
  return `<div class="progress-cell"><span>${actionQty(done)} / ${actionQty(row.plannedQuantity)}</span><span class="progress-line" aria-label="Đã thực hiện ${pct}%"><i style="width:${pct}%"></i></span><span class="muted">${pct}%</span></div>`;
}
function actionRemaining(row){ return row.plannedQuantity==null?"—":actionQty(Math.max(0,row.plannedQuantity-(row.completedQuantity||0))); }
function signalRows(){
  const positions=DATA.portfolio?.positions||[], stored=workspace().signals||{}, calls=repAgg(DATA.reports||[]).stocks;
  const map=new Map();
  positions.forEach(p=>map.set(p.t,{t:p.t,p,calls:[]}));
  calls.forEach(c=>{const row=map.get(c.t)||{t:c.t,p:null,calls:[]}; row.calls=Object.values(c.calls||{}); map.set(c.t,row);});
  return [...map.values()].map(row=>{
    const {t,p}=row, brokerCalls=row.calls||[], positive=brokerCalls.filter(c=>["MUA","KHẢ QUAN"].includes(c.rec)).length;
    const portfolioSignals=p?signals(p):[];
    const isRisk=portfolioSignals.includes("Cần xử lý")||portfolioSignals.includes("Sát vùng vi phạm");
    const recommendation=isRisk?portfolioSignals[0]:(brokerCalls.length&&positive/brokerCalls.length>=.6?"MUA":p?.status?.includes("GIẢM")?"BÁN":"THEO DÕI");
    const evidence=[p?"Danh mục Calida":null,brokerCalls.length?`${positive}/${brokerCalls.length} CTCK Mua/Khả quan`:null].filter(Boolean).join(" · ")||"Chưa đủ dữ liệu xác nhận";
    return {id:`signal:${t}`,t,sector:p?.sector||"Theo báo cáo CTCK",price:p?.price??null,chg:p?.chg??null,recommendation,
      evidence,source:brokerCalls.length?`${brokerCalls.length} CTCK${p?" + danh mục":""}`:"Danh mục",strength:Math.min(3,Math.max(1,brokerCalls.length?Math.round(positive/brokerCalls.length*3):isRisk?3:1)),
      status:stored[`signal:${t}`]?.status||"new", hasAction:actionRows().some(a=>a.t===t)};
  }).sort((a,b)=>(a.status!=="new")-(b.status!=="new")||b.strength-a.strength||a.t.localeCompare(b.t));
}
function strength(n){return `<span class="signal-strength" aria-label="Độ mạnh ${n}/3">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;}
async function setWorkspaceStatus(collection,id,status){
  if(!canEdit(collection)){notify("Tài khoản này chỉ có quyền xem module.","err");return;}
  try{
    const r=await api(`/api/${collection}/${encodeURIComponent(id)}/status`,{status},"PATCH");
    DATA.workspace ||= {actions:{},signals:{}}; DATA.workspace[collection] ||= {}; DATA.workspace[collection][id]=r.state;
    render(); notify("Đã cập nhật trạng thái.");
  }catch(e){notify("Không cập nhật được trạng thái: "+e.message,"err");}
}
function openActionDialog(id){

    <div class="box" style="margin-bottom:14px"><b>${esc(row.context)}</b><div class="muted" style="font-size:12px;margin-top:4px">Vùng giá: ${esc(row.zone)} · Giá hiện tại: ${nf(row.price,2)}</div></div>
    <div class="fgrid"><label>Trạng thái<select id="actionStatus">${options}</select></label><label>Hạn xử lý<input id="actionDeadline" type="date" value="${esc(row.deadline||"")}"></label>

      <label style="grid-column:1/-1">Ghi chú tiến độ<textarea id="actionNote" maxlength="300" placeholder="Thông tin thực hiện, lý do chờ…">${esc(row.note)}</textarea></label></div>
    <p class="muted" style="font-size:12px;margin:10px 0 0">Khối lượng và deadline là dữ liệu vận hành do người dùng khai báo; hệ thống không tự suy đoán từ giá thị trường.</p>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><span class="muted" id="actionSaveStatus" style="font-size:12.5px;flex:1"></span><button class="btn" id="saveAction" data-action-id="${esc(id)}">Lưu cập nhật</button></div>`;
  $("#actionDlg").showModal();
}
async function saveActionDetails(id){
  const status=$("#actionSaveStatus"), parseQuantity=(value,label)=>{
    if(value==="") return null;
    const number=Number(value);
    if(!Number.isSafeInteger(number)||number<0) throw new Error(`${label} phải là số nguyên không âm.`);
    return number;
  };
  let planned, completed;
  try { planned=parseQuantity($("#actionPlanned").value,"Khối lượng hành động"); completed=parseQuantity($("#actionCompleted").value,"Khối lượng đã thực hiện"); }
  catch(error){status.textContent=error.message;return;}
  if(planned!==null&&completed!==null&&completed>planned){status.textContent="Khối lượng đã thực hiện không thể lớn hơn khối lượng hành động.";return;}
  const button=$("#saveAction"); button.disabled=true; status.textContent="Đang lưu…";
  try{
    const state=await api(`/api/actions/${encodeURIComponent(id)}`,{status:$("#actionStatus").value,plannedQuantity:planned,completedQuantity:completed,deadline:$("#actionDeadline").value||null,note:$("#actionNote").value},"PATCH");
    DATA.workspace ||= {actions:{},signals:{}}; DATA.workspace.actions ||= {}; DATA.workspace.actions[id]=state.state;
    $("#actionDlg").close(); render(); notify("Đã cập nhật action.");
  }catch(error){status.textContent="Không lưu được: "+error.message;button.disabled=false;}
}
function pgActions(){

  const summary=(tab,icon,colour,value,label,goPage="")=>`<button ${goPage?`data-go="${goPage}"`: `data-actiontab="${tab}"`}><span class="action-kpi"><span class="badge ${colour}">${svg(icon)}</span><span><span class="num">${nf(value)}</span><span class="caption">${label}</span></span></span><span class="link" style="pointer-events:none">›</span></button>`;
  return `<h1>Khuyến nghị hành động</h1><p class="sub">Theo dõi hành động từ danh mục, khai báo khối lượng và cập nhật tiến độ theo quyền được cấp.</p>${sectionStamp("portfolio","Dữ liệu danh mục đến")}

/* ============ Administration ============ */
const roleLabel={viewer:"Chỉ xem",analyst:"Phân tích",admin:"Quản trị viên"};
const rolePermission={viewer:"Xem các phân hệ được cấp",analyst:"Xem dữ liệu, dùng AI, thêm báo cáo và cập nhật hành động/tín hiệu",admin:"Toàn quyền dữ liệu, quy trình dữ liệu và quản lý tài khoản"};
const moduleLabel={overview:"Tổng quan",brief:"Bản tin",portfolio:"Danh mục",flows:"Dòng tiền",funds:"Quỹ đầu tư",reports:"Báo cáo CTCK",actions:"Khuyến nghị hành động",signals:"Trung tâm tín hiệu",admin:"Quản trị"};
const moduleDefaults=role=>Object.fromEntries(Object.keys(moduleLabel).map(module=>[module,{view:role==="admin"||module!=="admin",edit:role==="admin"||(role==="analyst"&&["reports","actions","signals"].includes(module))} ]));
function permissionSummary(permissions){
  const rights=Object.entries(permissions||{}).filter(([,p])=>p?.view).map(([module,p])=>{
    const editLabel=p.edit?(["reports","actions","signals","admin"].includes(module)?" (chỉnh sửa)":" (quyền lưu sẵn)"):"";
    return `${moduleLabel[module]||module}${editLabel}`;
  });
  return rights.length?`Quyền hiện có: ${rights.join(", ")}`:"Chưa được cấp quyền module";
}
function permissionMatrix(permissions, role){
  const current=permissions||moduleDefaults(role);
  return `<div class="tbl-wrap" style="margin-top:14px"><table class="permission-matrix"><thead><tr><th>Phân hệ</th><th class="num">Xem</th><th class="num">Chỉnh sửa</th></tr></thead><tbody>${Object.entries(moduleLabel).map(([module,label])=>{
    const p=current[module]||{view:false,edit:false}, restricted=module==="admin"&&role!=="admin", editable=["reports","actions","signals","admin"].includes(module);
    const note=module==="admin"?'Chỉ dành cho vai trò admin':!editable?'Chưa hỗ trợ chỉnh sửa.':"";
    return `<tr><td><b>${label}</b>${note?`<div class="muted" style="font-size:12px">${note}</div>`:""}</td><td class="num check-cell"><label class="permission-toggle"><input type="checkbox" data-permission="${module}" data-action="view" ${p.view?"checked":""} ${restricted?"disabled":""} aria-label="Xem ${label}"></label></td><td class="num check-cell"><label class="permission-toggle"><input type="checkbox" data-permission="${module}" data-action="edit" ${p.edit?"checked":""} ${restricted||!editable?"disabled":""} aria-label="Chỉnh sửa ${label}${!editable?" (chưa hỗ trợ)":""}"></label></td></tr>`;
  }).join("")}</tbody></table></div>`;
}

        <p class="muted" style="margin:8px 0 0">${p.reason?`Lần gần nhất: ${esc(p.reason)}${p.finishedAt?` · ${new Date(p.finishedAt).toLocaleString("vi-VN")}`:""}`:"Chưa có lần chạy trong phiên này."}${p.error?`<br><span class="down">${esc(p.error)}</span>`:""}</p>
        <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn" id="runBuild" ${busy?"disabled":""}>Dựng lại bảng điều hành</button><button class="btn ghost" id="runFull" ${busy?"disabled":""}>Đồng bộ toàn bộ nguồn</button><span class="muted" style="font-size:12px">Đồng bộ toàn bộ sẽ gọi Google Sheets và nguồn giá.</span></div></div>

  return `<h1>Quản trị tài khoản</h1><p class="sub">Cấp quyền xem và chỉnh sửa theo từng module, riêng cho từng tài khoản.</p>

async function loadAdminUsers(){
  if(!canEdit("admin")) return;
  STATE.adminError="";
  try{ const r=await api("/api/admin/users"); STATE.adminUsers=r.users||[]; }
  catch(e){ STATE.adminUsers=null; STATE.adminError=e.message; }
  if(STATE.page==="admin") render();
}
async function loadAdminOperations(){
  if(!canEdit("admin")) return;
  STATE.adminOpsError="";
  try{ STATE.adminOps=await api("/api/admin/operations"); }
  catch(e){ STATE.adminOps=null; STATE.adminOpsError=e.message; }
  if(STATE.page==="admin") { render(); scheduleAdminPoll(); }
}
function scheduleAdminPoll(){
  clearTimeout(adminPollTimer);
  const pipeline=STATE.adminOps?.pipeline;
  if(STATE.page==="admin"&&canEdit("admin")&&(pipeline?.status==="running"||pipeline?.queuedJobs>0)){
    adminPollTimer=setTimeout(()=>{STATE.adminOps=null;loadAdminOperations();},3000);
  }
}
async function runPipeline(buildOnly){
  const message=buildOnly?"Dựng lại bảng điều hành từ dữ liệu hiện có?":"Đồng bộ toàn bộ nguồn dữ liệu? Thao tác có thể mất vài phút.";
  if(!confirm(message)) return;
  try{
    const result=await api("/api/pipeline/run",{buildOnly});
    notify(result.queued?"Quy trình dữ liệu đang xếp hàng; trạng thái sẽ tự cập nhật.":"Đã gửi yêu cầu chạy quy trình dữ liệu; trạng thái sẽ tự cập nhật.");
    STATE.adminOps=null; await loadAdminOperations();
  }catch(e){notify("Không thể chạy quy trình dữ liệu: "+e.message,"err");}
}

  const password=$("#adminPassword").value;
  const role=$("#adminRole").value;
  const name=username||$("#adminUsername").value.trim();
  const status=$("#adminSaveStatus");
  const permissions=Object.fromEntries(Object.keys(moduleLabel).map(module=>[module,{
    view:!!$(`#adminBody [data-permission="${module}"][data-action="view"]`)?.checked,
    edit:!!$(`#adminBody [data-permission="${module}"][data-action="edit"]`)?.checked,
  }]));
  if(!username&&!/^[a-zA-Z0-9._-]{3,64}$/.test(name)){status.textContent="Tên đăng nhập cần 3–64 ký tự: chữ, số, ., _ hoặc -.";return;}
  if((!username||password)&&password.length<12){status.textContent="Mật khẩu cần ít nhất 12 ký tự.";return;}
  $("#saveUser").disabled=true; status.textContent="Đang lưu…";
  try{
    const result=username
      ?await api(`/api/admin/users/${encodeURIComponent(username)}`,{user:{role,password,permissions}},"PATCH")
      :await api("/api/admin/users",{user:{username:name,password,role,permissions}});
    $("#adminDlg").close(); STATE.adminUsers=null; await loadAdminUsers();
    if(result.reauthenticate) location.assign("/login");
  }catch(e){status.textContent="Không lưu được: "+e.message; $("#saveUser").disabled=false;}
}
async function deleteUser(username){
  if(!confirm(`Xóa tài khoản ${username}? Thao tác này không thể hoàn tác.`)) return;
  try{await api(`/api/admin/users/${encodeURIComponent(username)}`,undefined,"DELETE"); STATE.adminUsers=null; await loadAdminUsers();}
  catch(e){alert("Không xóa được: "+e.message);}
}

/* ============ Chatbot + thêm báo cáo (qua server /api) ============ */
const SUGGEST=["CTCK nào thận trọng nhất và vì sao?","Đồng thuận target VN-Index cuối năm là bao nhiêu?","Rủi ro nào được nhiều CTCK cảnh báo nhất?","Các CTCK nói gì về HPG?"];
function paintChat(){
  const box=$("#msgs"); if(!box) return;
  if(!API_OK||!canEdit("reports")){ box.innerHTML=`<div class="msg a">${!canEdit("reports")?"Tài khoản này chỉ có quyền xem báo cáo.":`Chưa kết nối được máy chủ API (${esc(CFG.API_BASE||location.origin)}/api). Hỏi đáp và thêm báo cáo cần chạy server; các bảng tổng hợp vẫn hoạt động.`}</div>`; $("#chatSend").disabled=true; $("#suggest").innerHTML=""; return; }
  box.innerHTML = STATE.chat.length ? STATE.chat.map(m=>`<div class="msg ${m.role==="user"?"u":"a"} ${m.err?"err":""}">${esc(m.content)}</div>`).join("")
    : `<div class="msg a">Thư viện hiện có ${DATA.reports.length} báo cáo. Hỏi về quan điểm, target, ngành hay rủi ro của từng CTCK.</div>`;
  $("#suggest").innerHTML = STATE.chat.length ? "" : SUGGEST.map(s=>`<button data-ask="${esc(s)}">${esc(s)}</button>`).join("");
  $("#chatSend").disabled=STATE.chatBusy; $("#chatSend").textContent=STATE.chatBusy?"Đang trả lời…":"Gửi";
  box.scrollTop=box.scrollHeight;
}
async function ask(text){
  text=text.trim(); if(!text||STATE.chatBusy||!API_OK||!canEdit("reports")) return;
  STATE.chat.push({role:"user",content:text}); STATE.chat.push({role:"assistant",content:"Đang đọc báo cáo…"}); STATE.chatBusy=true; paintChat();
  const idx=STATE.chat.length-1;
  const messages=STATE.chat.slice(0,-1).filter(m=>!m.err).map(m=>({role:m.role,content:m.content})).slice(-12);
  try{ const r=await api("/api/chat",{messages}); STATE.chat[idx].content=r.text||"Không có câu trả lời."; }
  catch(e){ STATE.chat[idx]={role:"assistant",content:"Không trả lời được: "+e.message,err:true}; }
  STATE.chatBusy=false; if(STATE.page==="reports") paintChat();
}

function openAdd(existing=null){
  if(!canEdit("reports")) return;
  $("#addBody").innerHTML=`<div class="row"><h2 style="margin:0;flex:1;font-size:20px">${existing?"Chỉnh sửa báo cáo":"Thêm báo cáo"}</h2><button class="icon-btn" id="dlgClose" aria-label="Đóng">✕</button></div>
    <p class="muted" style="margin:4px 0 12px">${existing?"Thay đổi sẽ được ghi vào Excel nguồn và dựng lại bảng điều hành.":"Tải file PDF hoặc dán nội dung báo cáo. Hệ thống trích xuất các trường để bạn kiểm tra trước khi lưu."}</p>
    <label class="btn ghost" style="display:inline-block;margin-bottom:8px">Chọn file PDF<input type="file" id="pdfIn" accept="application/pdf" hidden></label> <span id="pdfName" class="muted"></span>
    <textarea id="rawTxt" placeholder="…hoặc dán nội dung báo cáo tại đây"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" id="extractBtn" ${API_OK?"":"disabled"}>Trích xuất</button><span class="muted" id="exStatus" style="font-size:12.5px">${API_OK?"":"Cần chạy server để dùng tính năng này."}</span></div>
    <div id="exForm"></div>`;
  STATE.editingReportId=existing?.id||"";
  $("#addDlg").showModal();
  if(existing) renderExForm(existing,existing.id);
}
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=()=>rej(new Error("Không đọc được file"));r.readAsDataURL(f);});
async function extract(){
  const raw=$("#rawTxt").value.trim(), file=$("#pdfIn").files[0];
  if(!raw&&!file){$("#exStatus").textContent="Chọn file PDF hoặc dán nội dung trước khi trích xuất.";return;}
  if(file&&file.size>20*1024*1024){$("#exStatus").textContent="File lớn hơn 20 MB.";return;}
  $("#extractBtn").disabled=true; $("#exStatus").textContent="Đang trích xuất…";
  try{
    const body=file?{pdfBase64:await fileB64(file),filename:file.name}:{text:raw};
    const r=await api("/api/extract",body);
    if(file&&!r.source) r.source=file.name;
    $("#exStatus").textContent="Kiểm tra lại các trường rồi lưu."; renderExForm(r,STATE.editingReportId);
  }catch(e){ $("#exStatus").textContent="Không trích xuất được: "+e.message; }
  $("#extractBtn").disabled=false;
}
function renderExForm(r,reportId=""){
  const f=(k,l,v)=>`<label>${l}<input data-f="${k}" value="${esc(v??"")}"></label>`;
  $("#exForm").innerHTML=`<div class="fgrid" style="margin-top:14px">
    ${f("broker","CTCK",r.broker)}${f("date","Ngày (YYYY-MM-DD)",r.date)}
    <label>Loại<select data-f="type">${["Chiến lược","Vĩ mô","Ngành","Doanh nghiệp"].map(x=>`<option ${x===r.type?"selected":""}>${x}</option>`).join("")}</select></label>
    <label>Quan điểm<select data-f="stance">${["Tích cực","Trung lập","Thận trọng","Tiêu cực"].map(x=>`<option ${x===r.stance?"selected":""}>${x}</option>`).join("")}</select></label>
    ${f("title","Tiêu đề",r.title)}${f("vnTarget","Mục tiêu VN-Index",r.vnTarget)}
    ${f("ow","Ngành tăng tỷ trọng (phẩy)",(r.ow||[]).join(", "))}${f("uw","Ngành giảm tỷ trọng (phẩy)",(r.uw||[]).join(", "))}
    ${f("stocks","Cổ phiếu (MÃ:KN:mục tiêu; …)",(r.stocks||[]).map(s=>`${s.t}:${s.rec}:${s.target??""}`).join("; "))}
    ${f("risks","Rủi ro (chủ đề:mức; …)",(r.risks||[]).map(k=>`${k.k}:${k.s}`).join("; "))}
    ${f("horizon","Tầm nhìn",r.horizon)}${f("source","Nguồn / tên file",r.source)}
    <label style="grid-column:1/-1">Tóm tắt<textarea data-f="summary" style="height:70px">${esc(r.summary)}</textarea></label></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><span class="muted" id="saveStatus" style="font-size:12.5px;flex:1"></span><button class="btn" id="saveRep" data-report-id="${esc(reportId)}">${reportId?"Lưu thay đổi":"Lưu báo cáo"}</button></div>`;
}
async function saveRep(){
  const g=k=>$(`#exForm [data-f="${k}"]`).value.trim(), sp=s=>s?s.split(/[,;]/).map(x=>x.trim()).filter(Boolean):[];
  const date=g("date");
  if(!g("broker")||!/^\d{4}-\d{2}-\d{2}$/.test(date)){ $("#saveStatus").textContent="Cần có tên CTCK và ngày đúng định dạng YYYY-MM-DD."; return; }
  const rep={broker:g("broker"),date,type:g("type"),title:g("title")||"(Không tiêu đề)",stance:g("stance"),
    vnTarget:parseFloat(g("vnTarget").replace(/\./g,"").replace(",","."))||null,horizon:g("horizon"),source:g("source"),ow:sp(g("ow")),uw:sp(g("uw")),
    stocks:g("stocks").split(";").map(x=>x.trim()).filter(Boolean).map(x=>{const [t,rec,tg]=x.split(":");return {t:(t||"").trim().toUpperCase(),rec:(rec||"").trim().toUpperCase(),target:parseFloat((tg||"").replace(",","."))||null};}).filter(s=>s.t),
    risks:g("risks").split(";").map(x=>x.trim()).filter(Boolean).map(x=>{const [k,s]=x.split(":");return {k:k.trim(),s:Math.min(3,Math.max(1,parseInt(s)||2))};}),
    summary:g("summary")};
  const reportId=$("#saveRep").dataset.reportId||"";
  $("#saveRep").disabled=true; $("#saveStatus").textContent="Đang lưu và cập nhật database…";
  try{ const result=await api(reportId?`/api/reports/${encodeURIComponent(reportId)}`:"/api/reports",{report:rep},reportId?"PATCH":undefined); $("#addDlg").close(); STATE.editingReportId=""; await refresh(true); STATE.repPeriod="Tất cả"; STATE.repSel=result.id||reportId||null; render(); }
  catch(e){ $("#saveStatus").textContent="Không lưu được: "+e.message; $("#saveRep").disabled=false; }
}
function editReport(id){const report=DATA.reports.find(r=>r.id===id);if(report&&canEdit("reports")) openAdd(report);}
async function deleteReport(id){
  const report=DATA.reports.find(r=>r.id===id); if(!report||!canEdit("reports")||!confirm(`Xóa báo cáo “${report.title}”? Thao tác này không thể hoàn tác.`)) return;
  try{await api(`/api/reports/${encodeURIComponent(id)}`,undefined,"DELETE"); STATE.repSel=null; await refresh(true); render();}
  catch(e){alert("Không xóa được báo cáo: "+e.message);}
}

/* ============ events ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,tr,[data-go]"); if(!t) return;
  const d=t.dataset;
  if(t.id==="menuBtn"){setNav(!document.body.classList.contains("nav-open"));return;}
  if(t.id==="navScrim"||t.id==="navClose"){setNav(false);return;}
  if(d.go){go(d.go);return;}
  if(d.ovtab){STATE.ovTab=d.ovtab;render();}
  if(d.newstab){STATE.newsTab=d.newstab;render();}
  if(d.pftab){STATE.pfTab=d.pftab;render();}
  if(d.pfsel){STATE.pfSel=d.pfsel;render();}
  if(d.pfdt){STATE.pfDetailTab=d.pfdt;render();}
  if(d.invtab){STATE.invTab=d.invtab;render();}
  if(d.fundtab){STATE.fundTab=d.fundtab;render();}
  if(d.actiontab){STATE.actionTab=d.actiontab;render();return;}
  if(d.signaltab){STATE.signalTab=d.signaltab;render();return;}
  if(d.actionStatus){setWorkspaceStatus("actions",d.workId,d.actionStatus);return;}
  if(d.signalStatus){setWorkspaceStatus("signals",d.workId,d.signalStatus);return;}
  if(d.openAction){STATE.actionTicker=d.openAction;STATE.actionTab="Tất cả";go("actions");return;}
  if(d.openSignal){STATE.signalQuery=d.openSignal;go("signals");return;}
  if(d.editAction){openActionDialog(d.editAction);return;}
  if(d.setupNextAction){openActionDialog(d.setupNextAction);return;}
  if("clearActionFilter" in d){STATE.actionTicker="";render();return;}
  if(d.rp){STATE.repPeriod=d.rp;render();}
  if(d.rt){STATE.repType=d.rt;render();}
  if(d.reptab){STATE.repTab=d.reptab;render();}
  if(d.admintab){STATE.adminTab=d.admintab;render();}
  if("rsel" in d){STATE.repSel=d.rsel||null;STATE.repTab="Thư viện";render();}
  if(d.ask){ask(d.ask);}
  if(d.editRep){editReport(d.editRep);}
  if(d.deleteRep){deleteReport(d.deleteRep);}
  if(d.editUser){openUserDialog(d.editUser);}
  if(d.deleteUser){deleteUser(d.deleteUser);}
  if(t.id==="chatSend"){const v=$("#chatIn").value;STATE.chatDraft="";$("#chatIn").value="";ask(v);}
  if(t.id==="addRep") openAdd();
  if(t.id==="addUser") openUserDialog();
  if(t.id==="reloadUsers"){STATE.adminUsers=null;STATE.adminError="";loadAdminUsers();}
  if(t.id==="reloadOps"){STATE.adminOps=null;STATE.adminOpsError="";loadAdminOperations();}
  if(t.id==="runBuild") runPipeline(true);
  if(t.id==="runFull") runPipeline(false);
  if(t.id==="notificationBtn") openNotificationDialog();
  if(t.id==="notificationClose") $("#notificationDlg").close();
  if(t.id==="enableNotifications") enableNotifications();
  if(t.id==="disableNotifications") disableNotifications();
  if(t.id==="testNotification") testNotification();
  if(t.id==="adminDlgClose") $("#adminDlg").close();
  if(t.id==="actionDlgClose") $("#actionDlg").close();
  if(t.id==="saveAction") saveActionDetails(t.dataset.actionId||"");
  if(t.id==="saveUser") saveUser(t.dataset.userId||"");
  if(t.id==="dlgClose") $("#addDlg").close();
  if(t.id==="extractBtn") extract();
  if(t.id==="saveRep") saveRep();
  if(t.id==="refreshBtn") refresh(true,true);
  if(t.id==="logoutBtn") logout();
  if(t.id==="themeBtn"){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;setTheme(dark?"light":"dark");notify(dark?"Đã chuyển sang giao diện sáng.":"Đã chuyển sang giao diện tối.");}
});
document.addEventListener("change",e=>{
  if(e.target.id==="pdfIn") $("#pdfName").textContent=e.target.files[0]?.name||"";
  if(e.target.id==="actionTicker"){STATE.actionTicker=e.target.value;render();return;}
  if(e.target.id==="actionSector"){STATE.actionSector=e.target.value;render();return;}
  if(e.target.id==="actionSource"){STATE.actionSource=e.target.value;render();return;}
  if(e.target.dataset.action==="view"&&!e.target.checked){ const edit=$(`#adminBody [data-permission="${e.target.dataset.permission}"][data-action="edit"]`); if(edit) edit.checked=false; }
  if(e.target.dataset.action==="edit"&&e.target.checked){ const view=$(`#adminBody [data-permission="${e.target.dataset.permission}"][data-action="view"]`); if(view) view.checked=true; }
  if(e.target.id==="adminRole"){
    const restricted=e.target.value!=="admin";
    $("#adminBody").querySelectorAll('[data-permission="admin"]').forEach(input=>{input.disabled=restricted;if(restricted) input.checked=false;});
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="chatIn"){STATE.chatDraft=e.target.value;return;}
  if(["actionQ","signalQ"].includes(e.target.id)){
    const key=e.target.id==="actionQ"?"actionQuery":"signalQuery", value=e.target.value, caret=e.target.selectionStart;
    STATE[key]=value; render();
    const field=$("#"+e.target.id); if(field){field.focus();field.setSelectionRange(caret,caret);}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Tab"&&document.body.classList.contains("nav-open")){
    const drawer=$("#appNav"), focusable=drawer?[...drawer.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]:[];
    if(focusable.length){const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  }
  if(e.key==="Escape"&&document.body.classList.contains("nav-open")){e.preventDefault();setNav(false);return;}
  if(["ArrowLeft","ArrowRight","Home","End"].includes(e.key)&&e.target.matches('[role="tab"]')){
    const tabs=[...e.target.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];
    const current=tabs.indexOf(e.target);
    const next=e.key==="Home"?0:e.key==="End"?tabs.length-1:(current+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;
    const dataKey=Object.keys(tabs[next]?.dataset||{})[0], dataValue=tabs[next]?.dataset?.[dataKey];
    e.preventDefault(); tabs[next]?.click(); setTimeout(()=>document.querySelector(`[data-${dataKey}="${dataValue}"][aria-selected="true"]`)?.focus(),0); return;
  }
  if(e.key==="Enter"&&e.target.id==="chatIn"&&!e.shiftKey){e.preventDefault();const v=e.target.value;STATE.chatDraft="";e.target.value="";ask(v);}
  if(e.key==="Enter"&&e.target.matches("tr[tabindex]")) e.target.click();
  if(e.key==="Enter"&&e.target.id==="q"){
    const q=e.target.value.trim().toUpperCase(); if(!q) return;
    const openSearchPage=(page, prepare)=>{
      if(!canView(page)){notify("Tài khoản này chưa có quyền mở mục phù hợp với tìm kiếm.","err");return;}
      prepare?.(); go(page);
    };
    if(DATA.portfolio.positions.some(p=>p.t===q)) openSearchPage("portfolio",()=>{STATE.pfSel=q;STATE.pfTab="Danh mục hiện tại";});
    else if(DATA.reports.some(r=>r.stocks.some(s=>s.t===q)||r.broker.toUpperCase().includes(q)||r.title.toUpperCase().includes(q))) openSearchPage("reports",()=>{STATE.repTab="Thư viện";});
    else if(/QUỸ|FUND|VFM|VCBF|SSIAM/.test(q)) openSearchPage("funds");
    else notify(`Không tìm thấy kết quả cho “${q}”.`,"err");
  }
});

/* ============ boot ============ */
function paintHeader(){
  const d=new Date(DATA.asOf);
  $("#dateTxt").textContent=d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"});
  $("#dowTxt").innerHTML=d.toLocaleDateString("vi-VN",{weekday:"long"}).replace(/^./,c=>c.toUpperCase())+
    ` · <button class="link" id="refreshBtn" style="margin:0;padding:0" title="Cập nhật lúc ${esc(DATA.meta?.generatedAt||"")}">Tải lại</button>`;
  const state=dataState(), stateEl=$("#dataState"); stateEl.textContent=state.text; stateEl.className=`tag data-state ${state.className}`; stateEl.title=state.title;
  $("#userAvatar").textContent=(CURRENT_USER?.username||"C").slice(0,1).toUpperCase();
}
async function logout(){
  try{ await api("/api/auth/logout",{}); }catch(e){} finally{ location.assign("/login"); }
}
async function refresh(force, announce=false){
  try{
    const d=await loadData();
    if(force||!DATA||d.meta?.generatedAt!==DATA.meta?.generatedAt){ DATA=d; paintHeader(); render(); if(announce) notify("Đã tải dữ liệu mới nhất."); }
    else if(announce) notify("Dữ liệu đang là bản mới nhất.");
  }catch(e){
    if(!DATA) $("#page").innerHTML=`<div class="card"><h2>Không tải được dữ liệu</h2><p class="prose">${esc(e.message)}. Chạy <code>python pipeline/run.py</code> để tạo file dữ liệu, rồi tải lại trang.</p></div>`;
    else if(announce) notify("Không tải lại được dữ liệu: "+e.message,"err");
  }
}
(async function boot(){
  const h=location.hash.slice(1); if(PAGES.some(p=>p.id===h)) STATE.page=h;
  syncNav(); window.addEventListener("resize",syncNav);
  $("#page").innerHTML='<div class="card empty">Đang tải dữ liệu…</div>';
  try{
    const health=await api("/api/health");
    const auth=await api("/api/auth/me");
    API_OK=!!health.ok; CURRENT_USER=auth.user; CSRF_TOKEN=auth.csrfToken||"";
  }catch(e){ API_OK=false; }
  await setupPush();
  await refresh(true);
  if(CFG.REFRESH_MINUTES>0) setInterval(()=>refresh(false), CFG.REFRESH_MINUTES*60000);
  window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(PAGES.some(p=>p.id===h)&&h!==STATE.page&&canView(h)){STATE.page=h;render();}});
})();
</script>
